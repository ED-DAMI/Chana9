spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chana9}
    username: ${DATABASE_USER:chana9}
    password: ${DATABASE_PASSWORD:chana9}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/master.yaml
    enabled: true
  messages:
    basename: messages
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      accept-case-insensitive-enums: true
app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    algorithm: HS512
  security:
    max-refresh-tokens-per-user: 5
    cleanup-cron: "0 0 2 * * *"
    refresh-cleanup-cron: "0 0 3 * * *"
  audit:
    async: true
    retain-days: 90
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
storage:
  root-dir: uploads
  max-file-size-bytes: 5242880
  thumbnail-width: 400
  thumbnail-height: 400
logging:
  level:
    org.springframework.security: TRACE
    ma.chana9: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    org.springframework.web: DEBUG
whatsApp:
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  api-version: v19.0
  template-name: chana9_otp
  template-language: fr
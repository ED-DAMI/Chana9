spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chana9
    username: chana9
    password: chana9
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  messages:
    basename: messages

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 86400000
    refresh-expiration: 604800000
    algorithm: HS512
  security:
    max-refresh-tokens-per-user: 5
    cleanup-cron: "0 0 2 * * *"
    refresh-cleanup-cron: "0 0 3 * * *"
  audit:
    async: true
    retain-days: 90
  otp:
    expiration-minutes: 5

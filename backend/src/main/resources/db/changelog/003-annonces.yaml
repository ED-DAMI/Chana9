databaseChangeLog:
  - changeSet:
      id: 003-enable-postgis
      author: chana9
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS postgis;

  - changeSet:
      id: 003-create-annonces-table
      author: chana9
      changes:
        - createTable:
            tableName: annonces
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: breed
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: price_negotiable
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: region
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: 'ACTIVE'
              - column:
                  name: gender
                  type: varchar(10)
              - column:
                  name: age_months
                  type: integer
              - column:
                  name: location
                  type: geometry(Point, 4326)
              - column:
                  name: address_label
                  type: varchar(255)
              - column:
                  name: delivery_available
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: delivery_price
                  type: decimal(8,2)
              - column:
                  name: top_lot_expires_at
                  type: timestamp
              - column:
                  name: expires_at
                  type: timestamp
              - column:
                  name: seller_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: annonces

  - changeSet:
      id: 003-add-annonce-constraints
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonces ADD CONSTRAINT chk_annonce_status CHECK (status IN ('ACTIVE', 'SOLD', 'EXPIRED', 'HIDDEN', 'PENDING'));
              ALTER TABLE annonces ADD CONSTRAINT chk_annonce_gender CHECK (gender IN ('MALE', 'FEMALE'));
databaseChangeLog:
  - changeSet:
      id: 003-enable-postgis
      author: chana9
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS postgis;
      rollback:
        - sql:
            sql: DROP EXTENSION IF EXISTS postgis;

  - changeSet:
      id: 003-create-annonces-table
      author: chana9
      changes:
        - createTable:
            tableName: annonces
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: breed
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: price_negotiable
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: region
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: ACTIVE
              - column:
                  name: gender
                  type: varchar(10)
              - column:
                  name: age_months
                  type: integer
              - column:
                  name: location
                  type: geometry(Point,4326)
              - column:
                  name: address_label
                  type: varchar(255)
              - column:
                  name: delivery_available
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: delivery_price
                  type: decimal(8,2)
              - column:
                  name: top_lot_expires_at
                  type: timestamp
              - column:
                  name: expires_at
                  type: timestamp
              - column:
                  name: seller_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: annonces

  - changeSet:
      id: 003-add-annonces-indexes-and-fk
      author: chana9
      changes:
        - addForeignKeyConstraint:
            baseTableName: annonces
            baseColumnNames: seller_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_annonce_seller
            onDelete: CASCADE

        - sql:
            sql: >-
              ALTER TABLE annonces
              ADD CONSTRAINT chk_annonce_status
              CHECK (status IN ('ACTIVE', 'SOLD', 'EXPIRED', 'HIDDEN', 'PENDING'));

        - sql:
            sql: >-
              ALTER TABLE annonces
              ADD CONSTRAINT chk_annonce_gender
              CHECK (gender IS NULL OR gender IN ('MALE', 'FEMALE'));

        - createIndex:
            indexName: idx_annonces_seller_id
            tableName: annonces
            columns:
              - column:
                  name: seller_id

        - createIndex:
            indexName: idx_annonces_status
            tableName: annonces
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_annonces_breed
            tableName: annonces
            columns:
              - column:
                  name: breed

        - createIndex:
            indexName: idx_annonces_region
            tableName: annonces
            columns:
              - column:
                  name: region

        - createIndex:
            indexName: idx_annonces_expires_at
            tableName: annonces
            columns:
              - column:
                  name: expires_at

        - sql:
            sql: CREATE INDEX idx_annonces_location ON annonces USING GIST (location);

      rollback:
        - dropForeignKeyConstraint:
            baseTableName: annonces
            constraintName: fk_annonce_seller
        - sql:
            sql: >-
              ALTER TABLE annonces DROP CONSTRAINT IF EXISTS chk_annonce_status;
        - sql:
            sql: >-
              ALTER TABLE annonces DROP CONSTRAINT IF EXISTS chk_annonce_gender;
        - dropIndex:
            indexName: idx_annonces_seller_id
            tableName: annonces
        - dropIndex:
            indexName: idx_annonces_status
            tableName: annonces
        - dropIndex:
            indexName: idx_annonces_breed
            tableName: annonces
        - dropIndex:
            indexName: idx_annonces_region
            tableName: annonces
        - dropIndex:
            indexName: idx_annonces_expires_at
            tableName: annonces
        - sql:
            sql: DROP INDEX IF EXISTS idx_annonces_location;
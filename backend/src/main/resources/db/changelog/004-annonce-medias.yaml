databaseChangeLog:

  - changeSet:
      id: 003-create-annonce-medias-table
      author: chana9
      changes:
        - createTable:
            tableName: annonce_medias
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: annonce_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_annonce_medias_annonce
                    references: annonces(id)
                    deleteCascade: true
              - column:
                  name: url
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: original_filename
                  type: varchar(255)
              - column:
                  name: content_type
                  type: varchar(50)
              - column:
                  name: size_bytes
                  type: bigint
              - column:
                  name: display_order
                  type: integer
                  defaultValueNumeric: 0
              - column:
                  name: is_cover
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        - createIndex:
            tableName: annonce_medias
            indexName: idx_annonce_medias_annonce_id
            columns:
              - column:
                  name: annonce_id
        - createIndex:
            tableName: annonce_medias
            indexName: idx_annonce_medias_is_cover
            columns:
              - column:
                  name: is_cover

  - changeSet:
      id: 003-check-annonce-medias-display-order
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_medias
              ADD CONSTRAINT chk_annonce_medias_display_order
              CHECK (display_order >= 0);
      rollback:
        - sql:
            sql: ALTER TABLE annonce_medias DROP CONSTRAINT chk_annonce_medias_display_order;

databaseChangeLog:
  - changeSet:
      id: 004-create-annonce-photos-table
      author: chana9
      changes:
        - createTable:
            tableName: annonce_photos
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: annonce_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_photos_annonce
                    references: annonces(id)
                    deleteCascade: true
              - column:
                  name: url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: is_cover
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: ordre
                  type: int
                  defaultValueNumeric: 0
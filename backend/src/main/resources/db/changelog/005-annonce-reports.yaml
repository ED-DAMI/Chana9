databaseChangeLog:

  - changeSet:
      id: 003-create-annonce-reports-table
      author: chana9
      changes:
        - createTable:
            tableName: annonce_reports
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: annonce_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_annonce_reports_annonce
                    references: annonces(id)
                    deleteCascade: true
              - column:
                  name: reporter_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: text
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamp
              - column:
                  name: processed_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_annonce_reports_processed_by
                    references: users(id)

        - addUniqueConstraint:
            tableName: annonce_reports
            constraintName: uq_annonce_reporter
            columnNames: annonce_id, reporter_id

        - createIndex:
            tableName: annonce_reports
            indexName: idx_annonce_reports_annonce_id
            columns:
              - column:
                  name: annonce_id
        - createIndex:
            tableName: annonce_reports
            indexName: idx_annonce_reports_reporter_id
            columns:
              - column:
                  name: reporter_id
        - createIndex:
            tableName: annonce_reports
            indexName: idx_annonce_reports_status
            columns:
              - column:
                  name: status

  - changeSet:
      id: 003-check-annonce-reports-reason
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_reports
              ADD CONSTRAINT chk_annonce_reports_reason
              CHECK (reason IN (
                'FRAUD_OR_SCAM',
                'WRONG_INFORMATION',
                'UNHEALTHY_ANIMAL',
                'DUPLICATE',
                'INAPPROPRIATE_MEDIA',
                'OTHER'
              ));
      rollback:
        - sql:
            sql: ALTER TABLE annonce_reports DROP CONSTRAINT chk_annonce_reports_reason;

  - changeSet:
      id: 003-check-annonce-reports-status
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_reports
              ADD CONSTRAINT chk_annonce_reports_status
              CHECK (status IN ('PENDING','APPROVED','REJECTED'));
      rollback:
        - sql:
            sql: ALTER TABLE annonce_reports DROP CONSTRAINT chk_annonce_reports_status;

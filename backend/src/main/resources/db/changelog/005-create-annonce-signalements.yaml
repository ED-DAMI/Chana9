databaseChangeLog:
  - changeSet:
      id: 005-create-annonce-signalements-table
      author: chana9
      changes:
        - createTable:
            tableName: annonce_signalements
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: annonce_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_signalement_annonce
                    referencedTableName: annonces
                    referencedColumnNames: id
                    deleteCascade: true
              - column:
                  name: signaleur_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: text
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: 'PENDING'
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
              - column:
                  name: traite_at
                  type: timestamp
              - column:
                  name: traite_par
                  type: uuid
        - addUniqueConstraint:
            columnNames: annonce_id, signaleur_id
            constraintName: idx_signalement_unique
            tableName: annonce_signalements
      rollback:
        - dropTable:
            tableName: annonce_signalements

  - changeSet:
      id: 006-add-signalement-constraints
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_signalements ADD CONSTRAINT chk_signalement_status CHECK (status IN ('PENDING', 'RESOLVED', 'REJECTED'));
databaseChangeLog:
  - changeSet:
      id: 011-create-annonce-alerts-table
      author: ED-DAMI
      changes:
        - createTable:
            tableName: annonce_alerts
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: buyer_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: breed
                  type: varchar(100)
              - column:
                  name: region
                  type: varchar(100)
              - column:
                  name: radius_km
                  type: integer
              - column:
                  name: max_price
                  type: numeric(10,2)
              - column:
                  name: min_age_months
                  type: integer
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        - createIndex:
            tableName: annonce_alerts
            indexName: idx_alert_buyer_id
            columns:
              - column:
                  name: buyer_id

        - createIndex:
            tableName: annonce_alerts
            indexName: idx_alert_is_active
            columns:
              - column:
                  name: is_active

        - createIndex:
            tableName: annonce_alerts
            indexName: idx_alert_breed
            columns:
              - column:
                  name: breed

        - createIndex:
            tableName: annonce_alerts
            indexName: idx_alert_region
            columns:
              - column:
                  name: region
      rollback:
        - dropTable:
            tableName: annonce_alerts

  - changeSet:
      id: 007-add-check-constraints-annonce-alerts
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_alerts
              ADD CONSTRAINT chk_alert_max_price_positive
              CHECK (max_price IS NULL OR max_price > 0);
              ALTER TABLE annonce_alerts
              ADD CONSTRAINT chk_alert_min_age_positive
              CHECK (min_age_months IS NULL OR min_age_months >= 0);
      rollback:
        - sql:
            sql: >
              ALTER TABLE annonce_alerts DROP CONSTRAINT chk_alert_max_price_positive;
              ALTER TABLE annonce_alerts DROP CONSTRAINT chk_alert_min_age_positive;
databaseChangeLog:
  - changeSet:
      id: 007-add-original-filename-to-annonce-medias
      author: chana9
      changes:
        - addColumn:
            tableName: annonce_medias
            columns:
              - column:
                  name: original_filename
                  type: varchar(255)
      rollback:
        - dropColumn:
            tableName: annonce_medias
            columnName: original_filename

  - changeSet:
      id: 007-add-content-type-to-annonce-medias
      author: chana9
      changes:
        - addColumn:
            tableName: annonce_medias
            columns:
              - column:
                  name: content_type
                  type: varchar(50)
      rollback:
        - dropColumn:
            tableName: annonce_medias
            columnName: content_type

  - changeSet:
      id: 007-add-size-bytes-to-annonce-medias
      author: chana9
      changes:
        - addColumn:
            tableName: annonce_medias
            columns:
              - column:
                  name: size_bytes
                  type: bigint
      rollback:
        - dropColumn:
            tableName: annonce_medias
            columnName: size_bytes

  - changeSet:
      id: 007-rename-order-to-media-order-in-annonce-medias
      author: chana9
      changes:
        - renameColumn:
            tableName: annonce_medias
            oldColumnName: order
            newColumnName: media_order
            columnDataType: integer
      rollback:
        - renameColumn:
            tableName: annonce_medias
            oldColumnName: media_order
            newColumnName: order
            columnDataType: integer

  - changeSet:
      id: 007-update-check-constraint-media-order
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_medias
              DROP CONSTRAINT IF EXISTS chk_media_order_positive;
              ALTER TABLE annonce_medias
              ADD CONSTRAINT chk_media_order_positive
              CHECK (media_order >= 0);
      rollback:
        - sql:
            sql: >
              ALTER TABLE annonce_medias
              DROP CONSTRAINT IF EXISTS chk_media_order_positive;
              ALTER TABLE annonce_medias
              ADD CONSTRAINT chk_media_order_positive
              CHECK ("order" >= 0);

  - changeSet:
      id: 007-add-format-webp-to-check-constraint-media
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_medias
              DROP CONSTRAINT IF EXISTS chk_media_format;
              ALTER TABLE annonce_medias
              ADD CONSTRAINT chk_media_format
              CHECK (format IN ('JPEG','PNG','HEIC','WEBP'));
      rollback:
        - sql:
            sql: >
              ALTER TABLE annonce_medias
              DROP CONSTRAINT IF EXISTS chk_media_format;
              ALTER TABLE annonce_medias
              ADD CONSTRAINT chk_media_format
              CHECK (format IN ('JPEG','PNG','HEIC'));

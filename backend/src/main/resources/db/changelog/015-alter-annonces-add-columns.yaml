databaseChangeLog:
  - changeSet:
      id: 015-annonces-add-age-fields
      author: chana9
      changes:
        - addColumn:
            tableName: annonces
            columns:
              - column:
                  name: date_naissance
                  type: date
                  remarks: "Date de naissance de l'animal, si connue par l'éleveur"
              - column:
                  name: age_mois
                  type: integer
                  remarks: "Âge estimé en mois si date_naissance inconnue"
      rollback:
        - dropColumn:
            tableName: annonces
            columnName: date_naissance
        - dropColumn:
            tableName: annonces
            columnName: age_mois

  - changeSet:
      id: 005-annonces-add-check-age
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonces
              ADD CONSTRAINT chk_annonces_age
              CHECK (date_naissance IS NOT NULL OR age_mois IS NOT NULL);
      rollback:
        - sql:
            sql: ALTER TABLE annonces DROP CONSTRAINT chk_annonces_age;

  - changeSet:
      id: 005-annonces-add-sexe
      author: chana9
      changes:
        - addColumn:
            tableName: annonces
            columns:
              - column:
                  name: sexe
                  type: varchar(10)
                  remarks: "MALE, FEMELLE"
        - sql:
            sql: >
              ALTER TABLE annonces
              ADD CONSTRAINT chk_annonces_sexe
              CHECK (sexe IN ('MALE', 'FEMELLE'));
      rollback:
        - sql:
            sql: ALTER TABLE annonces DROP CONSTRAINT chk_annonces_sexe;
        - dropColumn:
            tableName: annonces
            columnName: sexe

  - changeSet:
      id: 005-annonces-add-localisation
      author: chana9
      changes:
        - addColumn:
            tableName: annonces
            columns:
              - column:
                  name: localisation
                  type: geometry(Point, 4326)
                  remarks: "Coordonnées GPS de l'annonce (PostGIS)"
              - column:
                  name: adresse_label
                  type: varchar(255)
                  remarks: "Libellé lisible de l'adresse, ex: Khouribga, Chaouia"
        - sql:
            sql: >
              CREATE INDEX idx_annonces_localisation
              ON annonces USING GIST (localisation);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_annonces_localisation;
        - dropColumn:
            tableName: annonces
            columnName: localisation
        - dropColumn:
            tableName: annonces
            columnName: adresse_label

  - changeSet:
      id: 005-annonces-add-livraison
      author: chana9
      changes:
        - addColumn:
            tableName: annonces
            columns:
              - column:
                  name: livraison_disponible
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "L'éleveur propose-t-il la livraison ?"
              - column:
                  name: livraison_rayon_km
                  type: integer
                  remarks: "Rayon de livraison maximum en km"
              - column:
                  name: livraison_prix
                  type: numeric(8,2)
                  remarks: "Coût de la livraison en DH"
      rollback:
        - dropColumn:
            tableName: annonces
            columnName: livraison_disponible
        - dropColumn:
            tableName: annonces
            columnName: livraison_rayon_km
        - dropColumn:
            tableName: annonces
            columnName: livraison_prix

  - changeSet:
      id: 005-annonces-add-negociation
      author: chana9
      changes:
        - addColumn:
            tableName: annonces
            columns:
              - column:
                  name: prix_negociable
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Le prix est-il négociable ?"
      rollback:
        - dropColumn:
            tableName: annonces
            columnName: prix_negociable

  - changeSet:
      id: 005-annonces-add-expiration
      author: chana9
      changes:
        - addColumn:
            tableName: annonces
            columns:
              - column:
                  name: expires_at
                  type: timestamp
                  remarks: "Date d'expiration automatique de l'annonce (30j par défaut)"
        - sql:
            sql: >
              UPDATE annonces SET expires_at = created_at + INTERVAL '30 days'
              WHERE expires_at IS NULL;
      rollback:
        - dropColumn:
            tableName: annonces
            columnName: expires_at

databaseChangeLog:
- changeSet:
    id: 015-remove-format-from-annonce-medias
    author: ED-DAMI
    changes:
      - sql:
          sql: >
            ALTER TABLE annonce_medias
            DROP CONSTRAINT IF EXISTS chk_media_format;
      - dropColumn:
          tableName: annonce_medias
          columnName: format
    rollback:
      - addColumn:
          tableName: annonce_medias
          columns:
            - column:
                name: format
                type: varchar(10)
      - sql:
          sql: >
            ALTER TABLE annonce_medias
            ADD CONSTRAINT chk_media_format
            CHECK (format IN ('JPEG','PNG','HEIC','WEBP'));
- changeSet:
    id: 016-drop-columns-annonces
    author: chana9
    changes:
      - dropColumn:
          tableName: annonces
          columnName: estimated_weight
      - dropColumn:
          tableName: annonces
          columnName: delivery_radius_km
      - dropColumn:
          tableName: annonces
          columnName: is_top_lot
    rollback:
      - addColumn:
          tableName: annonces
          columns:
            - column:
                name: estimated_weight
                type: numeric(6,2)
            - column:
                name: delivery_radius_km
                type: integer
            - column:
                name: is_top_lot
                type: boolean
                defaultValueBoolean: false
databaseChangeLog:
  - changeSet:
      id: 016-create-annonce-medias
      author: chana9
      changes:
        - createTable:
            tableName: annonce_medias
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: annonce_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_medias_annonce
                    references: annonces(id)
                    deleteCascade: true
              - column:
                  name: url
                  type: varchar(512)
                  constraints:
                    nullable: false
                  remarks: "URL du média stocké (S3, Cloudinary, etc.)"
              - column:
                  name: ordre
                  type: integer
                  defaultValueNumeric: 0
                  remarks: "Position dans le carousel (0 = première)"
              - column:
                  name: is_principale
                  type: boolean
                  defaultValueBoolean: false
                  remarks: "Photo de couverture de l'annonce"
              - column:
                  name: format
                  type: varchar(10)
                  remarks: "JPEG, PNG, HEIC"
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()

  - changeSet:
      id: 006-annonce-medias-index
      author: chana9
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_medias_annonce_id ON annonce_medias (annonce_id);
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_medias_annonce_id;

  - changeSet:
      id: 006-annonce-medias-check-format
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_medias
              ADD CONSTRAINT chk_medias_format
              CHECK (format IN ('JPEG', 'PNG', 'HEIC'));
      rollback:
        - sql:
            sql: ALTER TABLE annonce_medias DROP CONSTRAINT chk_medias_format;

databaseChangeLog:
  - changeSet:
      id: 007-create-annonce-signalements
      author: chana9
      changes:
        - createTable:
            tableName: annonce_signalements
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: annonce_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_signalement_annonce
                    references: annonces(id)
                    deleteCascade: true
              - column:
                  name: signaleur_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_signalement_user
                    references: users(id)
              - column:
                  name: motif
                  type: varchar(30)
                  constraints:
                    nullable: false
                  remarks: "PRIX_ABUSIF, ANIMAL_INEXISTANT, PHOTOS_TROMPEUSES, VENDEUR_FRAUDULEUX, AUTRE"
              - column:
                  name: commentaire
                  type: text
                  remarks: "Précisions optionnelles du signaleur"
              - column:
                  name: statut
                  type: varchar(20)
                  defaultValue: EN_ATTENTE
                  remarks: "EN_ATTENTE, TRAITE, REJETE"
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
              - column:
                  name: traite_at
                  type: timestamp
                  remarks: "Date de traitement par l'admin"
              - column:
                  name: traite_par
                  type: uuid
                  remarks: "ID de l'admin qui a traité le signalement"

  - changeSet:
      id: 007-signalements-check-motif
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_signalements
              ADD CONSTRAINT chk_signalement_motif
              CHECK (motif IN ('PRIX_ABUSIF','ANIMAL_INEXISTANT','PHOTOS_TROMPEUSES','VENDEUR_FRAUDULEUX','AUTRE'));
      rollback:
        - sql:
            sql: ALTER TABLE annonce_signalements DROP CONSTRAINT chk_signalement_motif;

  - changeSet:
      id: 007-signalements-check-statut
      author: chana9
      changes:
        - sql:
            sql: >
              ALTER TABLE annonce_signalements
              ADD CONSTRAINT chk_signalement_statut
              CHECK (statut IN ('EN_ATTENTE','TRAITE','REJETE'));
      rollback:
        - sql:
            sql: ALTER TABLE annonce_signalements DROP CONSTRAINT chk_signalement_statut;

  - changeSet:
      id: 007-signalements-unique-per-user
      author: chana9
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_signalement_unique
              ON annonce_signalements (annonce_id, signaleur_id);
            remarks: "Un utilisateur ne peut signaler une annonce qu'une seule fois"
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_signalement_unique;

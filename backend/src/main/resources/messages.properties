error.auth.invalid-otp=The OTP code you entered is invalid.
error.auth.invalid-token=The authentication token is invalid.
error.auth.token-expired=Your session has expired. Please log in again.
error.auth.token-revoked=This token has been revoked and can no longer be used.
error.auth.device-fingerprint-mismatch=Unrecognized device. Please log in again.
error.auth.invalid-credentials=Invalid phone number or password.
error.auth.phone-already-exists=This phone number is already registered.
error.auth.phone-not-found=No account found with this phone number.


message.auth.otp-sent=A verification code has been sent to your phone.

# Messages par défaut
error.default=Une erreur inattendue est survenue. Veuillez réessayer.
message.default=L'opération a été effectuée avec succès.

# Erreurs d'authentification
error.auth.access-denied=Accès refusé. Vous n'avez pas les droits nécessaires pour effectuer cette action.
error.auth.invalid-otp=Le code OTP saisi est incorrect.
error.auth.invalid-token=Le jeton d'authentification est invalide.
error.auth.token-expired=Votre session a expiré. Veuillez vous reconnecter.
error.auth.token-revoked=Ce jeton a été révoqué et ne peut plus être utilisé.
error.auth.device-fingerprint-mismatch=Appareil non reconnu. Veuillez vous reconnecter.
error.auth.invalid-credentials=Numéro de téléphone ou mot de passe incorrect.
error.auth.phone-already-exists=Ce numéro de téléphone est déjà associé à un compte.
error.auth.phone-not-found=Aucun compte ne correspond à ce numéro de téléphone.

# Messages de succès d'authentification
message.auth.otp-sent=Un code de vérification a été envoyé sur votre téléphone.
message.auth.otp-verified=Votre numéro de téléphone a été vérifié avec succès.
message.auth.logout-success=Vous avez été déconnecté avec succès.
message.auth.tokens-revoked=Toutes les sessions actives ont été fermées.
message.auth.register-success=Votre compte a été créé avec succès.
message.auth.login-success=Ravi de vous revoir ! Vous êtes maintenant connecté.
message.auth.password-reset-success=Votre mot de passe a été réinitialisé avec succès.
message.auth.token-refreshed=Votre session a été renouvelée avec succès.

error.favorite.already-added=Cette annonce est déjà dans vos favoris.
error.favorite.not-found=Cette annonce n'est pas dans vos favoris.
error.report.already-reported=Vous avez déjà signalé cette annonce.
error.report.own-annonce=Vous ne pouvez pas signaler votre propre annonce.

error.payment.already-unlocked=Vous avez déjà débloqué le contact de cette annonce.
error.payment.own-annonce=Vous ne pouvez pas débloquer le contact de votre propre annonce.
error.payment.buyer-not-found=Acheteur introuvable.
error.payment.transaction-not-found=Transaction introuvable.
error.payment.invalid-signature=Signature de paiement invalide.
error.payment.not-unlocked=Ce contact n'a pas encore été débloqué.
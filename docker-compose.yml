services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: chana9-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-chana9}
      POSTGRES_USER:     ${POSTGRES_USER:-chana9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
      TZ:                UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chana9} -d ${POSTGRES_DB:-chana9}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - chana9-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chana9-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:       ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL:                 jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chana9}
      DATABASE_USER:                ${POSTGRES_USER:-chana9}
      DATABASE_PASSWORD:            ${POSTGRES_PASSWORD}
      JWT_SECRET:                   ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION:        ${JWT_ACCESS_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION:       ${JWT_REFRESH_EXPIRATION:-604800000}
      OTP_EXPIRATION_MINUTES:       ${OTP_EXPIRATION_MINUTES:-5}
      SMS_PROVIDER:                 ${SMS_PROVIDER:-log}
      SMS_API_KEY:                  ${SMS_API_KEY:-}
      SMS_SENDER_ID:                ${SMS_SENDER_ID:-Chana9}
      PAYMENT_PROVIDER:             ${PAYMENT_PROVIDER:-mock}
      PAYMENT_API_KEY:              ${PAYMENT_API_KEY:-}
      PAYMENT_API_SECRET:           ${PAYMENT_API_SECRET:-}
      PAYMENT_MERCHANT_ID:          ${PAYMENT_MERCHANT_ID:-}
      PAYMENT_CALLBACK_URL:         ${PAYMENT_CALLBACK_URL:-}
      COMMISSION_RATE:              ${COMMISSION_RATE:-0.03}
      COMMISSION_MAX_DH:            ${COMMISSION_MAX_DH:-200}
      STORAGE_PROVIDER:             ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH:           /app/uploads
      S3_BUCKET_NAME:               ${S3_BUCKET_NAME:-}
      S3_REGION:                    ${S3_REGION:-}
      S3_ACCESS_KEY:                ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY:                ${S3_SECRET_KEY:-}
      FIREBASE_ENABLED:             ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID:          ${FIREBASE_PROJECT_ID:-}
      MAIL_HOST:                    ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:                    ${MAIL_PORT:-587}
      MAIL_USERNAME:                ${MAIL_USERNAME:-}
      MAIL_PASSWORD:                ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS:         ${CORS_ALLOWED_ORIGINS:-*}
      JAVA_OPTS:                    ${JAVA_OPTS:--Xms256m -Xmx512m}
      TZ:                           UTC
    volumes:
      - uploads:/app/uploads
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 60s
    networks:
      - chana9-network

  nginx:                                    # ✅ au même niveau que api et postgres
    image: nginx:alpine
    container_name: chana9-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - uploads:/app/uploads:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - chana9-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  maven-cache:
    driver: local

networks:
  chana9-network:
    driver: bridge